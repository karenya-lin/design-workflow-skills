<title id="title">整套 Figma 換品牌 / Rebrand a complete Figma workflow</title>
<desc id="desc">Three instructional steps: inventory screens and links, pilot and apply the new brand, then check states and prototype branches. Preserve the original design throughout. This is not a screenshot of an executed project.</desc>
