<text x="354" y="186" font-size="19" font-weight="650" fill="#20313f">確認範圍與例外</text>
<text x="354" y="215" font-size="14" fill="#526475">Check scope and exceptions</text>
<path d="M627 183h14m-5-5 5 5-5 5" fill="none" stroke="#0f766e" stroke-width="2"/>
