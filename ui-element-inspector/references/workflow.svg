<svg xmlns="http://www.w3.org/2000/svg" width="960" height="350" viewBox="0 0 960 350" role="img" aria-labelledby="title desc">
<title id="title">指認畫面元素 / Point at UI elements</title>
<desc id="desc">Three-step instructional diagram. Not an execution result.</desc>
